# Compila os instaladores e anexa à aba Releases do GitHub:
#   • Android: APK universal + APKs por ABI (arm64-v8a, armeabi-v7a, x86_64)
#     (todos com a voz Kokoro embutida, ~140 MB a mais — ver tool/fetch_kokoro_model.py)
#   • iOS: .ipa SEM assinatura (para AltStore / SideStore / TrollStore)
# Dispara ao criar uma tag `vX.Y.Z` (ex.: git tag v1.0.0 && git push origin v1.0.0).
name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: v1.0.0). Vazio = apenas artefatos, sem release"
        required: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  versao:
    name: Conferir versão
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags das releases anteriores
      - name: Tag ↔ pubspec.yaml e versionCode
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Sem tag (workflow_dispatch só para gerar artefatos) não há o que conferir.
          if [[ "$TAG" != v* ]]; then echo "Sem tag de release: verificação ignorada."; exit 0; fi
          bash tool/check_release_version.sh "$TAG"

  android:
    name: Android (APKs)
    needs: versao
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Voz Kokoro embutida (SHA-256 conferido)
        run: python3 ../tool/fetch_kokoro_model.py

      - name: Keystore de release (opcional, via secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Assinando com a chave de release."
          else
            echo "::warning::Secrets de assinatura ausentes — APKs assinados com a chave de debug."
          fi

      - name: Build APK universal
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/ViaSacra-universal.apk

      - name: Build APKs por ABI
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "../dist/ViaSacra-$abi.apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  ios:
    name: iOS (.ipa sem assinatura)
    needs: versao
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Voz Kokoro embutida (SHA-256 conferido)
        run: python3 ../tool/fetch_kokoro_model.py

      - name: Build iOS (sem codesign)
        run: flutter build ios --release --no-codesign

      - name: Empacotar .ipa
        run: |
          mkdir -p Payload ../dist
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry ../dist/ViaSacra-unsigned.ipa Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*.ipa
          if-no-files-found: error

  release:
    name: Publicar Release
    needs: [android, ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/releases

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums SHA-256
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # Notas da versão: docs/releases/<tag>.md (obrigatório para releases estáveis)
      # seguidas das instruções de instalação.
      - name: Montar notas da release
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::Tag inválida: '$TAG'"; exit 1; }
          notas="docs/releases/${TAG}.md"
          if [ -f "$notas" ]; then
            cat "$notas" > release-body.md
          elif [[ "$TAG" == *-* ]]; then
            echo "Pré-release de teste da próxima versão." > release-body.md
          else
            echo "::error::Faltam as notas da versão em $notas"
            exit 1
          fi
          cat >> release-body.md <<'MD'

          ## Instalação

          **Android** — baixe `ViaSacra-universal.apk` (funciona em qualquer aparelho) ou o APK da sua arquitetura
          (`arm64-v8a` para a maioria dos celulares atuais). Também funciona com o [Obtainium](https://github.com/ImranR98/Obtainium).

          **iOS** — baixe `ViaSacra-unsigned.ipa` e instale com [AltStore](https://altstore.io),
          [SideStore](https://sidestore.io) ou TrollStore. Veja o passo a passo no README.

          Verifique a integridade com `SHA256SUMS.txt`.
          MD

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Via Sacra ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/*
          body_path: release-body.md
