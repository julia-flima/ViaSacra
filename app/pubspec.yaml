name: via_sacra
description: >-
  Via Sacra — Liturgia Diária, Homilias, Santo Terço, Catecismo e Orações.
  Gratuito, sem anúncios, sem rastreadores e Open Source (GPL-3.0).
publish_to: "none"
homepage: https://github.com/julia-flima/ViaSacra
repository: https://github.com/julia-flima/ViaSacra
issue_tracker: https://github.com/julia-flima/ViaSacra/issues

# versão semântica + build number (usado como versionCode no Android).
# Para APKs por ABI o Flutter soma 1000*ABI automaticamente.
version: 1.6.0+10

environment:
  sdk: ^3.13.0
  flutter: ">=3.50.0"

# ---------------------------------------------------------------------------
# DEPENDÊNCIAS — todas Open Source, sem Google Play Services/Firebase/analytics.
# Licença de cada pacote documentada ao lado (verifique antes de adicionar novos!)
# ---------------------------------------------------------------------------
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.1 # BSD-3-Clause — Material Design (desacoplado do SDK a partir do Flutter 3.47)

  # Estado
  provider: ^6.1.5 # MIT

  # Armazenamento local (offline-first)
  sqlite3: ^3.9.1 # MIT — SQLite com FTS5 (ver hooks abaixo para builds F-Droid)
  shared_preferences: ^2.5.6 # BSD-3-Clause
  path_provider: ^2.1.6 # BSD-3-Clause
  path: ^1.9.1 # BSD-3-Clause

  # Rede (somente JSON estático do próprio projeto via jsDelivr/GitHub)
  http: ^1.6.0 # BSD-3-Clause

  # Áudio e leitura em voz alta
  flutter_tts: ^4.2.5 # MIT — TTS nativo do sistema (offline)
  just_audio: ^0.10.6 # MIT — ExoPlayer/Media3 (Apache-2.0) e AVPlayer
  audio_service: ^0.18.19 # MIT — reprodução em 2º plano + tela de bloqueio
  audio_session: ^0.2.4 # MIT
  # Última versão 1.x com espeak-ng embutido (v2+ removeu); Apache-2.0 + espeak-ng GPL-3.0.
  sherpa_onnx: 1.13.8
  archive: ^4.7.1 # MIT — extração streaming das vozes Piper (.tar.bz2)
  crypto: ^3.0.6 # BSD-3-Clause — confere o SHA-256 das vozes baixadas
  ffi: ^2.1.4 # BSD-3-Clause — sinal de cancelamento compartilhado com o Isolate da voz

  # Notificações 100% locais (sem FCM/APNs remoto)
  flutter_local_notifications: ^23.0.3 # BSD-3-Clause
  timezone: ^0.11.2 # BSD-2-Clause
  flutter_timezone: ^5.1.1 # Apache-2.0

  # Utilidades
  intl: ^0.20.3 # BSD-3-Clause
  share_plus: ^13.3.1 # BSD-3-Clause
  url_launcher: ^6.3.3 # BSD-3-Clause
  file_picker: ^13.4.0 # MIT
  webview_flutter: ^4.14.1 # BSD-3-Clause
  web: ^1.1.1 # BSD-3-Clause — iframe youtube-nocookie na Web

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0 # BSD-3-Clause

flutter:
  uses-material-design: true
  generate: false
  assets:
    - assets/data/
    - assets/art/
    - assets/db/
    - assets/legal/
    - assets/bible/
    # Voz Kokoro embutida no APK/IPA (gerada por tool/fetch_kokoro_model.py; vazia no git e na Web).
    - assets/voice/kokoro/
  # Tipografia 100% embutida (nada é baixado da internet — vale também para a
  # versão Web, que por padrão buscaria fontes no servidor do Google).
  # Licenças em assets/fonts/README.md. Para usar EB Garamond/Inter (OFL):
  # tool/fetch_fonts.sh e declare as famílias abaixo; elas ganham prioridade.
  fonts:
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather-Light.ttf
          weight: 300
        - asset: assets/fonts/Merriweather-Regular.ttf
          weight: 400
        - asset: assets/fonts/Merriweather-Italic.ttf
          style: italic
        - asset: assets/fonts/Merriweather-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: ViaSacraSymbols
      fonts:
        - asset: assets/fonts/ViaSacraSymbols.ttf

# Builds reproduzíveis / F-Droid: compile o SQLite a partir do código-fonte
# (amalgamation de domínio público) em vez de baixar binários pré-compilados.
# O script `tool/fdroid_prebuild.sh` baixa o sqlite3.c verificado por SHA3 e
# ativa este bloco automaticamente.
# hooks:
#   user_defines:
#     sqlite3:
#       source: source
#       path: third_party/sqlite/sqlite3.c
#       defines:
#         defines:
#           - SQLITE_ENABLE_FTS5
#           - SQLITE_DQS=0
#           - SQLITE_THREADSAFE=1
